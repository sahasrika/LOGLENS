[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "Analyzes application and server logs to help developers understand what went wrong."
requires-python = ">=3.11"
dependencies = [
    "mmh3==4.1.0",
    "bitarray==2.9.2",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "PyJWT>=2.8,<3",
    "cryptography>=42,<45",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
]
aws = [
    "boto3>=1.35,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["loglens*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["loglens"]
omit = ["tests/*"]
